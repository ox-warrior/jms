listen: ":8391"
core_host: "https://jumpserver.example.com"
access_key_id: "<access_key.id>"
access_key_secret: "<access_key.secret>"
# Core 的 PostgreSQL，务必用只给 SELECT 权限的账号——jmsd 从不写库，只读 users_user 里的启用用户
core_db_dsn: "postgres://readonly_user:pass@core-db-host:5432/jumpserver?sslmode=disable"
# Google 登录一次管多少天，到期再登录
mfa_interval_days: 10

# 必填。人怎么登录：jms 在本机自动生成一把钥匙，浏览器里登录一次 Google，
# jmsd 按 Google 邮箱找到同 email 的 JumpServer 用户（users_user.email），把这把钥匙绑给他，
# mfa_interval_days 天后过期再登录。绑定存在 redis（没配就在内存，重启后大家要重新登录）。
# 用户在 JumpServer 里被禁用，30 秒内他的钥匙就失效。
# client_id 是 GCP 里「桌面应用」类型的 OAuth 客户端，必须和编进 jms 的是同一个（Makefile 的 JMS_GOOGLE_CLIENT_ID）。
# 只认 hosted_domain 这个 Workspace 的账号。jmsd 要能访问 https://www.googleapis.com 拉 Google 的公钥。
google:
  client_id: "xxxx.apps.googleusercontent.com"
  hosted_domain: "example.com"

# 可选。给机器用的钥匙（比如 sre-triage 线上环境里的 AI），那边开不了浏览器。
# 每条是一把公钥（.pub 文件的那一行）和它代表的 JumpServer 用户名，永久有效；
# 能连哪些机器由那个用户的授权决定，所以只给它授权只读账号。jms 用 -i 指定对应私钥。
# service_keys:
#   - user: "sre-triage-agent"
#     public_key: "ssh-ed25519 AAAA... sre-triage"
#   # 不写 user：这把钥匙自己没有权限，每个请求必须带 --on-behalf-of <邮箱>，按那个人的授权办事。
#   # 它能代表任何人，私钥按这个分量保管。
#   - public_key: "ssh-ed25519 AAAA... gateway"

# 可选。审计事件写到这个 Elasticsearch（出票、SQL 查询、Google 登录、隧道），
# 每天一个索引 jmsd-audit-YYYY-MM-DD（北京时间），保留 30 天；索引模板和 ILM 策略 jmsd 启动时自己建。
# 不配就只有 jmsd 自己的日志。
# audit_es: "http://es.example.com:9200"

# 日志级别："info"（默认）或 "debug"。
# info 只记错误、写操作和少数关键事件；debug 会额外记录每次数据库查询和 Core API 调用的耗时。
log_level: "info"

# 可选。不配这一段，登录状态（钥匙绑定）就留在进程内存里，jmsd 一重启所有人都要重新登录一次 Google。
# 配上之后钥匙绑定和防重放 nonce 都存进 Redis，重启不再丢。
#
# 不支持密码/TLS：这里假定的是一个只监听回环地址的无认证 Redis。存进去的都不是
# 秘密（用户 ID、公钥、随机 nonce），但**能连上它的进程可以自己写一个
# jmsd:key:<指纹>，把任意钥匙绑给任意人**。Redis 必须 bind 127.0.0.1。
#
# 配了但连不上 = jmsd 启动失败，不会静默退回内存。
# redis:
#   addr: "127.0.0.1:6379"
#   db: 0

# ---- 隧道（可选，默认关）----
#
# 开了之后 jmsd 会多监听一个端口，讲 SSH，只做一件事：把客户端要的 TCP 流从
# **jmsd 这台机器**拨出去（jms -w 9090 在笔记本上起一个 SOCKS5）。认证用的是同一套
# 身份——Google 登录绑定的那把钥匙，由 SSH 协议本身完成验签，客户端拿
# /v1/tunnel-config 下发的 host key 做 pin，所以第一次连接就不需要"信任首见"。
#
# 要想清楚再开：这是唯一一个 **Core 里不留任何记录** 的功能。没有票据、没有会话、
# 没有命令审计——用户拿自己的凭据连目标，这正是隧道的用途，也是为什么下面的 allow
# 和 jmsd 自己的日志是唯一的边界和唯一的记录。
#
# tunnel:
#   enabled: true
#   listen: ":8392"                      # 独立端口，可以单独做防火墙策略
#   # advertise: "jmsd.example.com:8392" # 留空 = 客户端访问控制面用的主机名 + 上面的端口
#   host_key: "/etc/jmsd/tunnel_host_key" # 不存在会自动生成（ed25519, 0600），之后固定复用
#   # allow 可选：不写 = 任意目标都放行（下面三类永远拒绝）；写了就只放行列出的。
#   # 端口要逐个列，不给区间。
#   allow:
#     - {cidr: "10.20.0.0/16", ports: [443, 5432]}
#     - {cidr: "10.20.7.9/32", ports: [6379]}
#   # 再加一道：目标 IP 还必须是调用者在 JumpServer 里有权限的资产地址。
#   # 这是把隧道挂到 Core 权限模型上的唯一办法，否则 allow 对所有人都一样宽。
#   # 代价是每条隧道连接多一次资产列表查询（30s 一刷，和吊销复查同一个 tick）。
#   require_permitted_asset: true
#   max_channels: 64                     # 单条连接的并发流上限
#
# 无论 allow 怎么写，这三类目标永远拒绝（tunnelpolicy.go 的 hardDenyReason）：
#   169.254.0.0/16  云元数据——会直接吐出 jmsd 宿主机的 IAM 临时凭据
#   127.0.0.0/8 ::1 jmsd 自己的 localhost——那儿有它的 Redis，能写就能把任意钥匙绑给任意人
#   0.0.0.0 / 组播   不指向单个对端，连到哪取决于 jmsd 的路由表而不是这份策略
